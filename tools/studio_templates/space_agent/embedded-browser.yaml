cols: 5
id: embedded-browser
name: Embedded Browser
description: A Space Agent-style embedded browser with tabs, URL bar, navigation, screenshot view, and recording. Powered by the Hermes browser backend.
renderer: |
  async (parent, space, ctx) => {
  const authHeaders = () => ({
    'X-Hermes-Session-Token': window.__HERMES_SESSION_TOKEN__ || '',
    'Content-Type': 'application/json',
  });

  const panel = document.createElement('div');
  panel.style.cssText = `
    display:flex;flex-direction:column;height:100%;box-sizing:border-box;
    padding:12px;background:linear-gradient(180deg, rgba(20,20,24,0.98), rgba(10,10,12,0.98));
    color:#f4f4f5;font-family:-apple-system, Inter, system-ui, sans-serif;overflow:hidden;gap:10px;
  `;

  const toolbar = document.createElement('div');
  toolbar.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:0 0 auto;';
  const btn = (label) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.textContent = label;
    el.style.cssText = 'border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:#f4f4f5;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;';
    el.onmouseenter = () => el.style.background = 'rgba(255,255,255,0.09)';
    el.onmouseleave = () => el.style.background = 'rgba(255,255,255,0.05)';
    return el;
  };
  const back = btn('←');
  const forward = btn('→');
  const reload = btn('↻');
  const newTab = btn('+ Tab');
  const record = btn('● Recording');
  const open = btn('Open');
  const url = document.createElement('input');
  url.type = 'text';
  url.placeholder = 'https://example.com';
  url.autocomplete = 'off';
  url.spellcheck = false;
  url.style.cssText = 'flex:1 1 260px;min-width:180px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#f4f4f5;padding:8px 10px;font-size:13px;outline:none;box-sizing:border-box;';
  const go = btn('Go');
  toolbar.append(back, forward, reload, newTab, record, url, go, open);

  const meta = document.createElement('div');
  meta.style.cssText = 'display:flex;flex-direction:column;gap:2px;flex:0 0 auto;min-width:0;';
  const title = document.createElement('div');
  title.style.cssText = 'font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
  const subtitle = document.createElement('div');
  subtitle.style.cssText = 'font-size:11px;color:rgba(255,255,255,0.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
  const error = document.createElement('div');
  error.style.cssText = 'font-size:11px;color:#ff9b9b;white-space:normal;display:none;';
  meta.append(title, subtitle, error);

  const tabStrip = document.createElement('div');
  tabStrip.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:0 0 auto;';

  const viewport = document.createElement('div');
  viewport.style.cssText = 'position:relative;flex:1 1 auto;min-height:0;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);background:#000;';
  const img = document.createElement('img');
  img.alt = 'Embedded browser screenshot';
  img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;background:#000;';
  const empty = document.createElement('div');
  empty.textContent = 'Loading embedded browser…';
  empty.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,0.55);background:radial-gradient(circle at center, rgba(255,255,255,0.05), rgba(0,0,0,0.92));';
  viewport.append(img, empty);

  panel.append(toolbar, meta, tabStrip, viewport);
  parent.append(panel);

  let alive = true;
  async function request(path, body) {
    const endpoint = path.startsWith('/api/') ? path : `/api/studio/browser/${path}`;
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: authHeaders(),
      body: body ? JSON.stringify(body) : '{}',
    });
    if (!res.ok) {
      throw new Error(await res.text());
    }
  }

  function renderTabs(tabs) {
    tabStrip.innerHTML = '';
    const list = Array.isArray(tabs) ? tabs : [];
    if (!list.length) {
      const hint = document.createElement('div');
      hint.textContent = 'No tabs yet';
      hint.style.cssText = 'font-size:11px;color:rgba(255,255,255,0.48);padding:2px 0;';
      tabStrip.append(hint);
      return;
    }
    list.forEach((tab) => {
      const tabBtn = document.createElement('button');
      tabBtn.type = 'button';
      const label = tab.title || tab.url || `Tab ${tab.index + 1}`;
      tabBtn.textContent = tab.active ? `• ${label}` : label;
      tabBtn.style.cssText = tab.active
        ? 'border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.14);color:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'
        : 'border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#f4f4f5;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
      tabBtn.onclick = () => request('/api/studio/browser/tab/select', { index: tab.index }).then(refresh).catch(refresh);
      tabStrip.append(tabBtn);
    });
  }

  async function refresh() {
    try {
      const res = await fetch('/api/studio/browser/state', { headers: authHeaders() });
      if (!res.ok) throw new Error(await res.text());
      const state = await res.json();
      url.value = state.url || url.value;
      title.textContent = state.title || 'Embedded Browser';
      subtitle.textContent = state.url || 'No URL loaded yet';
      error.style.display = state.error ? 'block' : 'none';
      error.textContent = state.error || '';
      record.textContent = state.recording ? '■ Stop Recording' : '● Recording';
      renderTabs(state.tabs);
      if (state.image) img.src = state.image;
      empty.style.display = state.image ? 'none' : 'flex';
      if (!state.image) empty.textContent = 'Loading embedded browser…';
    } catch (err) {
      title.textContent = 'Embedded Browser';
      subtitle.textContent = 'Browser helper unavailable';
      error.style.display = 'block';
      error.textContent = String(err && err.message ? err.message : err);
      empty.style.display = 'flex';
      empty.textContent = 'Embedded browser failed to load';
      tabStrip.innerHTML = '';
    }
  }

  const openUrl = async (value) => {
    const next = (value || '').trim();
    if (!next) return;
    await request('navigate', { url: next });
    await refresh();
  };

  const createTab = async () => {
    await request('/api/studio/browser/tab/new', {});
    await refresh();
  };

  const toggleRecord = async () => {
    const res = await fetch('/api/studio/browser/state', { headers: authHeaders() });
    if (!res.ok) throw new Error(await res.text());
    const state = await res.json();
    if (state.recording) {
      await request('/api/studio/browser/record/stop', {});
    } else {
      await request('/api/studio/browser/record/start', {});
    }
    await refresh();
  };

  back.onclick = () => request('back', {}).then(refresh).catch(refresh);
  forward.onclick = () => request('forward', {}).then(refresh).catch(refresh);
  reload.onclick = () => request('reload', {}).then(refresh).catch(refresh);
  newTab.onclick = () => createTab().catch(refresh);
  record.onclick = () => toggleRecord().catch(refresh);
  go.onclick = () => openUrl(url.value).catch(refresh);
  open.onclick = () => {
    const next = (url.value || '').trim();
    if (next) window.open(next, '_blank', 'noopener,noreferrer');
  };
  url.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      void openUrl(url.value).catch(refresh);
    }
  });

  const timer = window.setInterval(() => { if (alive) void refresh(); }, 1500);
  await refresh();
  return { cleanup: () => { alive = false; window.clearInterval(timer); } };
}
