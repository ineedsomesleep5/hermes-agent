cols: 5
id: web-browser
name: Web Browser
description: A mini embedded web browser similar to the one in Space Agent.
renderer: |
  async (parent, spaceRef) => {
      parent.style.cssText = "position:relative;height:100%;display:flex;flex-direction:column;background:#1e1e1e;border-radius:8px;overflow:hidden;font-family:sans-serif;";
      
      const header = document.createElement('div');
      header.style.cssText = "display:flex;padding:8px;background:#2d2d2d;border-bottom:1px solid #3d3d3d;gap:8px;align-items:center;";
      
      const input = document.createElement('input');
      input.type = "text";
      input.placeholder = "Enter URL (e.g., https://example.com)";
      input.style.cssText = "flex:1;padding:6px 12px;border-radius:4px;border:1px solid #444;background:#1a1a1a;color:#fff;outline:none;font-size:13px;";
      input.value = "https://example.com";
      
      const goBtn = document.createElement('button');
      goBtn.textContent = "Go";
      goBtn.style.cssText = "padding:6px 16px;border-radius:4px;border:none;background:#3b82f6;color:white;cursor:pointer;font-weight:bold;font-size:13px;";
      
      const iframe = document.createElement('iframe');
      iframe.style.cssText = "flex:1;border:none;width:100%;background:white;";
      iframe.src = input.value;
      
      function navigate() {
          let url = input.value.trim();
          if (!url) return;
          if (!url.startsWith('http://') && !url.startsWith('https://')) {
              url = 'https://' + url;
              input.value = url;
          }
          iframe.src = url;
      }
      
      goBtn.addEventListener('click', navigate);
      input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') navigate();
      });
      
      header.appendChild(input);
      header.appendChild(goBtn);
      parent.appendChild(header);
      parent.appendChild(iframe);
  }
